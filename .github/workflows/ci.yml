name: CI — Web, Services & Flutter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  FLUTTER_VERSION: '3.19.6'
  JAVA_VERSION: '17'

# ─────────────────────────────────────────────────────────────
jobs:

  # ── 1. Lint & Type-check (web + services) ─────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm -r exec tsc --noEmit

  # ── 2. Unit tests (services) ───────────────────────────────
  test-services:
    name: Service Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weddingos
          POSTGRES_PASSWORD: weddingos_test
          POSTGRES_DB: weddingos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter auth-service exec prisma generate
          pnpm --filter booking-service exec prisma generate
          pnpm --filter payment-service exec prisma generate
          pnpm --filter user-service exec prisma generate
          pnpm --filter execution-service exec prisma generate
          pnpm --filter media-service exec prisma generate
          pnpm --filter search-service exec prisma generate

      - name: Run service tests
        env:
          DATABASE_URL: postgresql://weddingos:weddingos_test@localhost:5432/weddingos_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-min-32-chars-long
          NODE_ENV: test
        run: pnpm test

      - name: Upload coverage
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: services

  # ── 2b. AI Service lint & test (Python) ────────────────────
  test-ai-service:
    name: AI Service — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          cd services/ai-service
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: |
          cd services/ai-service
          ruff check .

      - name: Run tests
        run: |
          cd services/ai-service
          python -m pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found — skipping"

  # ── 3. Web App build ───────────────────────────────────────
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api-staging.weddingos.in' }}

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 7

  # ── 4. Flutter Analysis ────────────────────────────────────
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        working-directory: apps/mobile
        run: flutter test --coverage

      - name: Upload Flutter coverage
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/mobile/coverage/lcov.info
          flags: flutter

  # ── 5. Flutter Build Android APK ──────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: flutter-analyze

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Decode keystore
        if: github.ref == 'refs/heads/main'
        working-directory: apps/mobile/android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Build APK (debug for PRs, release for main)
        working-directory: apps/mobile
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            flutter build apk --release --split-per-abi \
              --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'https://api.weddingos.in' }}
          else
            flutter build apk --debug
          fi
        env:
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ── 6. Flutter Build iOS (macOS only) ─────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: flutter-analyze
    # Only run on main / release tags to save minutes
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Install iOS dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build iOS (no codesign for CI)
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'https://api.weddingos.in' }}

      - name: Archive IPA
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/mobile/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r WeddingOS.ipa Payload

      - name: Upload IPA
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: apps/mobile/build/ios/iphoneos/WeddingOS.ipa
          retention-days: 30

  # ── 7. Docker build & push (services) ─────────────────────
  docker-services:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-services, build-web]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    strategy:
      matrix:
        service: [auth-service, user-service, vendor-service, booking-service, payment-service, notification-service, review-service, search-service, chat-service, media-service, execution-service, ai-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/weddingos-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/weddingos-${{ matrix.service }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 8. Deploy to Staging ───────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-services, build-android]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply (Staging)
        working-directory: infrastructure/terraform/staging
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"
        env:
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.STAGING_JWT_SECRET }}
          TF_VAR_razorpay_key_id: ${{ secrets.STAGING_RAZORPAY_KEY_ID }}
          TF_VAR_razorpay_key_secret: ${{ secrets.STAGING_RAZORPAY_KEY_SECRET }}

  # ── 9. Deploy to Production ────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-services]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production  # requires manual approval

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply (Production)
        working-directory: infrastructure/terraform/production
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"
        env:
          TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.PROD_JWT_SECRET }}
          TF_VAR_razorpay_key_id: ${{ secrets.PROD_RAZORPAY_KEY_ID }}
          TF_VAR_razorpay_key_secret: ${{ secrets.PROD_RAZORPAY_KEY_SECRET }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: WeddingOS ${{ github.ref_name }}
          draft: false
          prerelease: false
