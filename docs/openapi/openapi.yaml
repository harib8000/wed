                $ref: '#/components/schemas/BudgetPlannerOutput'
        '500':
          description: AI provider failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'

  /ai/vendor-recommendations:
    post:
      tags: [AI]
      summary: Get AI vendor recommendation criteria
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRecommendInput'
      responses:
        '200':
          description: Recommendation guidance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationOutput'
        '500':
          description: AI provider failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'

  /ai/chat:
    post:
      tags: [AI]
      summary: Wedding planning assistant chat
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatInput'
      responses:
        '200':
          description: AI assistant response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatOutput'
        '500':
          description: AI provider failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'

  /ai/health:
    get:
      tags: [AI]
      summary: AI service health
      description: Standalone ai-service implements this as `/health`; documented here with `/ai/health` for the unified gateway-facing contract.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: ai-service }
                  ai_provider: { type: string, example: openai }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: x-internal-api-key
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit100:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
    VendorIdPath:
      in: path
      name: vendorId
      required: true
      schema:
        type: string
        format: uuid
    ReviewIdPath:
      in: path
      name: reviewId
      required: true
      schema:
        type: string
        format: uuid
    DocIdPath:
      in: path
      name: docId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation or malformed request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or expired authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Locked:
      description: Resource temporarily locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiMeta:
      type: object
      properties:
        requestId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    ErrorObject:
      type: object
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
        field:
          type: string
          nullable: true
        details:
          type: object
          additionalProperties: true
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    MessageEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
        meta:
          $ref: '#/components/schemas/ApiMeta'
    MessageNoMetaEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
        timestamp:
          type: string
          format: date-time
          nullable: true
    HealthSimple:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
    UserRole:
      type: string
      enum: [customer, vendor, coordinator, admin, super_admin]
    UserStatus:
      type: string
      enum: [active, suspended, deleted]
    VendorCategory:
      type: string
      enum:
        - PHOTOGRAPHER
        - VIDEOGRAPHER
        - CATERER
        - DECORATOR
        - VENUE
        - DJ_SOUND
        - BAND_ENTERTAINMENT
        - BRIDAL_MAKEUP
        - GROOM_MAKEUP
        - MEHENDI
        - PANDIT_PRIEST
        - WEDDING_PLANNER
        - INVITATIONS
        - CHOREOGRAPHER
        - BARTENDER
        - LIGHTING
        - FIREWORKS
        - TENT_HOUSE
        - TRANSPORTATION
        - FLORIST
    VendorStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, ACTIVE, SUSPENDED, BLACKLISTED, REJECTED, PENDING_KYC]
    PackageType:
      type: string
      enum: [BASIC, STANDARD, PREMIUM, CUSTOM]
    BookingStatus:
      type: string
      enum: [ENQUIRY, QUOTE_SENT, QUOTE_ACCEPTED, ADVANCE_PENDING, ADVANCE_PAID, CONFIRMED, CHECKIN, COMPLETED, CANCELLED_BY_CUSTOMER, CANCELLED_BY_VENDOR, DISPUTED, REFUNDED]
    EventType:
      type: string
      enum: [WEDDING_CEREMONY, RECEPTION, ENGAGEMENT, HALDI, MEHNDI, SANGEET, BACHELOR_PARTY, PRE_WEDDING_SHOOT, BIRTHDAY, ANNIVERSARY, CORPORATE, OTHER]
    PaymentStatus:
      type: string
      enum: [CREATED, PENDING, CAPTURED, FAILED, REFUNDED, PARTIALLY_REFUNDED]
    EscrowStatus:
      type: string
      enum: [HELD, RELEASED_TO_VENDOR, REFUNDED_TO_CUSTOMER, DISPUTED]
    RefundReason:
      type: string
      enum: [CANCELLATION, DISPUTE_RESOLVED_CUSTOMER, OTHER]
    DisputeStatus:
      type: string
      enum: [OPEN, UNDER_REVIEW, RESOLVED_CUSTOMER, RESOLVED_VENDOR, CLOSED]
    DisputeReason:
      type: string
      enum: [no_show, poor_quality, late_arrival, wrong_items, overcharging, cancellation, rude_behaviour, incomplete_service]
    KycStatus:
      type: string
      enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED]
    DocumentType:
      type: string
      enum: [AADHAAR, PAN, PASSPORT, DRIVING_LICENSE, VOTER_ID, GSTIN, BANK_STATEMENT]
    BudgetCategory:
      type: string
      enum: [VENUE, CATERING, PHOTOGRAPHY, VIDEOGRAPHY, DECORATION, MAKEUP, MUSIC, TRANSPORT, INVITATION, MEHENDI, ATTIRE, JEWELLERY, GIFTS, ACCOMMODATION, HONEYMOON, OTHER]
    GuestSide:
      type: string
      enum: [BRIDE, GROOM, MUTUAL]
    GuestGroup:
      type: string
      enum: [FAMILY, FRIENDS, COLLEAGUES, NEIGHBOURS, OTHERS]
    GuestRsvpStatus:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED, MAYBE]
    MealPref:
      type: string
      enum: [VEG, NON_VEG, JAIN, VEGAN, NO_PREFERENCE]
    NotificationChannel:
      type: string
      enum: [PUSH, SMS, WHATSAPP, EMAIL, IN_APP]
    NotificationStatus:
      type: string
      enum: [QUEUED, SENT, DELIVERED, FAILED, SKIPPED]
    TaskStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, DONE, SKIPPED]
    TaskCategory:
      type: string
      enum: [VENDOR_BOOKING, VENUE, CATERING, DECORATION, CEREMONY, GUEST_MANAGEMENT, PHOTOGRAPHY, ENTERTAINMENT, LOGISTICS, LEGAL, OTHER]
    SendOtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^\+91[6-9]\d{9}$'
          example: +919876543210
    VerifyOtpRequest:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
          pattern: '^\+91[6-9]\d{9}$'
        otp:
          type: string
          pattern: '^\d{6}$'
          minLength: 6
          maxLength: 6
        deviceId:
          type: string
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string
    RegisterVendorRequest:
      type: object
      required: [phone, businessName, category, city]
      properties:
        phone:
          type: string
          pattern: '^\+91[6-9]\d{9}$'
        businessName:
          type: string
          minLength: 2
          maxLength: 255
        category:
          type: string
          enum: [venue, catering, photography, videography, decor, makeup, mehendi, music, transport, invitation, priest, other]
        city:
          type: string
          minLength: 2
          maxLength: 100
    AuthUserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        role:
          $ref: '#/components/schemas/UserRole'
        phoneVerified: { type: boolean }
    AuthUser:
      allOf:
        - $ref: '#/components/schemas/AuthUserSummary'
        - type: object
          properties:
            email:
              type: string
              format: email
              nullable: true
            status:
              $ref: '#/components/schemas/UserStatus'
            emailVerified:
              type: boolean
            createdAt:
              type: string
              format: date-time
    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        dateOfBirth: { type: string, format: date-time }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        pincode:
          type: string
          pattern: '^\d{6}$'
        partnerName: { type: string, maxLength: 100 }
        weddingDate: { type: string, format: date-time }
        estimatedBudgetPaise: { type: integer, minimum: 1 }
        guestCount: { type: integer, minimum: 1, maximum: 100000 }
        venueCity: { type: string, maxLength: 100 }
        businessName: { type: string, maxLength: 200 }
        businessCity: { type: string, maxLength: 100 }
    UpdateNotifPrefsRequest:
      type: object
      properties:
        whatsappNotif: { type: boolean }
        emailNotif: { type: boolean }
        pushNotif: { type: boolean }
        smsNotif: { type: boolean }
    RegisterPushTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          minLength: 10
        platform:
          type: string
          enum: [ios, android, web]
        deviceId:
          type: string
          maxLength: 200
    UploadKycRequest:
      type: object
      required: [docType, contentType]
      properties:
        docType:
          $ref: '#/components/schemas/DocumentType'
        contentType:
          type: string
          pattern: '^image\/(jpeg|png|webp)|application\/pdf$'
    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        dateOfBirth: { type: string, format: date-time, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        pincode: { type: string, nullable: true }
        partnerName: { type: string, nullable: true }
        weddingDate: { type: string, format: date-time, nullable: true }
        estimatedBudgetPaise: { type: integer, nullable: true }
        guestCount: { type: integer, nullable: true }
        venueCity: { type: string, nullable: true }
        businessName: { type: string, nullable: true }
        businessCity: { type: string, nullable: true }
        whatsappNotif: { type: boolean }
        emailNotif: { type: boolean }
        pushNotif: { type: boolean }
        smsNotif: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserProfileEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            profile:
              $ref: '#/components/schemas/UserProfile'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    PresignResult:
      type: object
      properties:
        uploadUrl: { type: string }
        key: { type: string }
        s3Key: { type: string, nullable: true }
        publicUrl: { type: string }
        expiresIn: { type: integer, example: 300 }
        mock: { type: boolean, nullable: true }
    PresignEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/PresignResult'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    PresignNoMetaEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/PresignResult'
    KycReviewRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
        note:
          type: string
    KycDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        docType:
          $ref: '#/components/schemas/DocumentType'
        s3Key: { type: string }
        status:
          $ref: '#/components/schemas/KycStatus'
        reviewNote: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BudgetItem:
