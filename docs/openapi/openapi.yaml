      responses:
        '200':
          description: Conversation returned or created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Chat]
