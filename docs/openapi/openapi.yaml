openapi: 3.0.3
info:
  title: WeddingOS Unified API
  version: 1.0.0
  description: |
    Unified OpenAPI 3.0 specification for the WeddingOS microservices platform.

    This document was assembled from the actual service route files and related
    Zod / Prisma / Pydantic definitions in the monorepo. Paths are documented as
    gateway-facing routes using the service prefixes requested by the user
    (`/auth`, `/users`, `/vendors`, `/bookings`, `/payments`, `/execution`,
    `/notifications`, `/reviews`, `/search`, `/media`, `/chat`, `/ai`).

    Notes:
    - Most services return a common JSON envelope with `success`, `data`, and often `meta`.
    - Internal routes may accept either a bearer token with admin role or `x-internal-api-key`.
    - Chat real-time Socket.IO events are described in tag descriptions and README, while this spec focuses on HTTP endpoints.
servers:
  - url: http://localhost:8000
    description: Local API gateway
  - url: https://api-staging.weddingos.in
    description: Staging
  - url: https://api.weddingos.in
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: OTP login, token rotation, session lifecycle, and vendor account bootstrap.
  - name: Users
    description: User profiles, notification preferences, KYC, budget planner data, checklist, and guest list.
  - name: Vendors
    description: Vendor profile management, public catalog/search endpoints, packages, portfolio, availability, and admin moderation.
  - name: Bookings
    description: Enquiry, quote, booking lifecycle, admin analytics, and vendor dashboard analytics.
  - name: Payments
    description: Razorpay order flow, payment verification, invoice generation, escrow, refunds, disputes, and revenue analytics.
  - name: Execution
    description: Wedding timeline creation and task management.
  - name: Notifications
    description: In-app notifications, internal event fan-out, and public contact form.
  - name: Reviews
    description: Customer reviews, vendor replies, helpful votes, and review analytics.
  - name: Search
    description: Elasticsearch-backed vendor search, autocomplete, and internal indexing.
  - name: Media
    description: Presigned upload URL generation and media deletion.
  - name: Chat
    description: |
      Chat HTTP endpoints for conversation discovery and message history.

      Socket.IO real-time events implemented by chat-service but not modeled as OpenAPI operations:
      - `join:conversation`
      - `message:send`
      - `typing:start`
      - `typing:stop`
  - name: AI
    description: AI-powered budget planning, vendor recommendation guidance, and assistant chat.
paths:
  /auth/send-otp:
    post:
      tags: [Auth]
      summary: Send login OTP
      description: Sends a 6-digit OTP to an Indian mobile number. Rate limiting and temporary account lock responses are explicit in the implementation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: OTP sent successfully
                      expiresInMinutes:
                        type: integer
                        example: 10
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP and issue tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      expiresIn:
                        type: integer
                        example: 900
                      user:
                        $ref: '#/components/schemas/AuthUserSummary'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '423':
          $ref: '#/components/responses/Locked'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      description: Accepts the refresh token from the httpOnly cookie or fallback request body.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Access token rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      expiresIn:
                        type: integer
                        example: 900
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional fallback when not using the refresh cookie.
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user
      responses:
        '200':
          description: Current auth user record
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/AuthUser'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/register-vendor:
    post:
      tags: [Auth]
      summary: Create vendor-role auth account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVendorRequest'
      responses:
        '201':
          description: Vendor auth account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      userId:
                        type: string
                        format: uuid
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/health:
    get:
      tags: [Auth]
      summary: Auth service health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /users/me:
    get:
      tags: [Users]
      summary: Get or create my profile
      responses:
        '200':
          description: Profile record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/notifications:
    put:
      tags: [Users]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotifPrefsRequest'
      responses:
        '200':
          description: Updated profile with notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/me/avatar/presign:
    post:
      tags: [Users]
      summary: Get presigned avatar upload URL
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
                  example: image/jpeg
      responses:
        '200':
          description: Presigned upload data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/push-token:
    post:
      tags: [Users]
      summary: Register push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenRequest'
      responses:
        '200':
          description: Token registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Users]
      summary: Deactivate push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/me/kyc/presign:
    post:
      tags: [Users]
      summary: Initiate KYC upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadKycRequest'
      responses:
        '201':
          description: Presigned upload data and KYC document record
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    allOf:
                      - $ref: '#/components/schemas/PresignResult'
                      - type: object
                        properties:
                          kycDocumentId:
                            type: string
                            format: uuid
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get profile by user id
      description: Admin-only lookup.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/kyc/{docId}/review:
    patch:
      tags: [Users]
      summary: Review KYC document
      parameters:
        - $ref: '#/components/parameters/DocIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycReviewRequest'
      responses:
        '200':
          description: Reviewed KYC document
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      doc:
                        $ref: '#/components/schemas/KycDocument'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/budget:
    get:
      tags: [Users]
      summary: List budget items and summary
      responses:
        '200':
          description: Budget items and rollups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetListEnvelope'
    post:
      tags: [Users]
      summary: Create budget item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetItemRequest'
      responses:
        '201':
          description: Created budget item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/me/budget/{id}:
    patch:
      tags: [Users]
      summary: Update budget item
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetItemRequest'
      responses:
        '200':
          description: Updated budget item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete budget item
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/checklist:
    get:
      tags: [Users]
      summary: List checklist items
      responses:
        '200':
          description: Checklist items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistListEnvelope'
    post:
      tags: [Users]
      summary: Create checklist item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChecklistItemRequest'
      responses:
        '201':
          description: Created checklist item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItemEnvelope'

  /users/me/checklist/generate:
    post:
      tags: [Users]
      summary: Generate checklist suggestions from wedding date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateChecklistRequest'
      responses:
        '201':
          description: Generated checklist items
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChecklistItem'
                      totalGenerated:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /users/me/checklist/{id}:
    patch:
      tags: [Users]
      summary: Update checklist item
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistItemRequest'
      responses:
        '200':
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItemEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete checklist item
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/guests:
    get:
      tags: [Users]
      summary: List guests
      responses:
        '200':
          description: Guest list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestListEnvelope'
    post:
      tags: [Users]
      summary: Create guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestRequest'
      responses:
        '201':
          description: Created guest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestEnvelope'

  /users/me/guests/{id}:
    patch:
      tags: [Users]
      summary: Update guest
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuestRequest'
      responses:
        '200':
          description: Updated guest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete guest
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/health:
    get:
      tags: [Users]
      summary: User service health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /vendors/search:
    get:
      tags: [Vendors]
      summary: Search vendors from vendor-service index
      security: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: minRating
          schema: { type: number }
        - in: query
          name: minPricePaise
          schema: { type: integer }
        - in: query
          name: maxPricePaise
          schema: { type: integer }
        - in: query
          name: plusMembersOnly
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [rating, price_asc, price_desc, bookings, relevance]
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorSearchEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /vendors/suggest:
    get:
      tags: [Vendors]
      summary: Suggest vendors by prefix
      security: []
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
        - in: query
          name: city
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Suggested vendor snippets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      suggestions:
                        type: array
                        items:
                          $ref: '#/components/schemas/VendorSuggestion'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /vendors/{slug}:
    get:
      tags: [Vendors]
      summary: Get vendor by slug
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Vendor detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /vendors:
    post:
      tags: [Vendors]
      summary: Create vendor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVendorRequest'
      responses:
        '201':
          description: Created vendor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /vendors/me/profile:
    get:
      tags: [Vendors]
      summary: Get my vendor profile
      responses:
        '200':
          description: Vendor profile for authenticated vendor/admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Vendors]
      summary: Update my vendor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVendorRequest'
      responses:
        '200':
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /vendors/me/packages:
    post:
      tags: [Vendors]
      summary: Create or update vendor package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPackageRequest'
      responses:
        '201':
          description: Upserted package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorPackageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /vendors/me/packages/{packageId}:
    delete:
      tags: [Vendors]
      summary: Delete vendor package
      parameters:
        - in: path
          name: packageId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Package deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /vendors/me/portfolio/presign:
    post:
      tags: [Vendors]
      summary: Get presigned portfolio upload URL
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
                  example: image/jpeg
      responses:
        '200':
          description: Presigned upload data including vendorId
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    allOf:
                      - $ref: '#/components/schemas/PresignResult'
                      - type: object
                        properties:
                          vendorId:
                            type: string
                            format: uuid
                  meta:
                    $ref: '#/components/schemas/ApiMeta'

  /vendors/me/portfolio/confirm:
    post:
      tags: [Vendors]
      summary: Confirm uploaded portfolio item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPortfolioRequest'
      responses:
        '201':
          description: Portfolio item recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioItemEnvelope'

  /vendors/me/availability:
    post:
      tags: [Vendors]
      summary: Replace future availability blocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityUpdateRequest'
      responses:
        '200':
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'

  /vendors/me/submit-review:
    post:
      tags: [Vendors]
      summary: Submit vendor profile for admin review
      responses:
        '200':
          description: Vendor status updated for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorEnvelope'

  /vendors/admin/list:
    get:
      tags: [Vendors]
      summary: Admin list vendors
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit100'
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Paginated vendor admin list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVendorListEnvelope'

  /vendors/admin/stats:
    get:
      tags: [Vendors]
