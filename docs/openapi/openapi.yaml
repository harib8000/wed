          $ref: '#/components/schemas/MealPref'
        plusOnes: { type: integer }
        tableNumber: { type: string, nullable: true }
        roomAllocation: { type: string, nullable: true }
        inviteSentAt: { type: string, format: date-time, nullable: true }
        rsvpRespondedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateGuestRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, maxLength: 20 }
