          - GET
          - POST
          - OPTIONS

# ─── Global Plugins ──────────────────────────────────────────────────────────
plugins:
  # Rate limiting (global)
  - name: rate-limiting
    config:
      minute: 500
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # CORS
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:3001"
        - "http://localhost:3002"
        - "https://weddingos.in"
        - "https://www.weddingos.in"
        - "https://admin.weddingos.in"
        - "https://vendor.weddingos.in"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 3600

  # Request size limiting
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
