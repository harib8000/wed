_format_version: "3.0"
_transform: true

# ─── WeddingOS API Gateway Configuration ─────────────────────────────────────
# Kong Declarative Configuration (DB-less mode)
# All microservice routes are proxied through Kong at port 8000

services:
  # ── Auth Service ──────────────────────────────────────────────────────────
  - name: auth-service
    url: http://auth-service:4001
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

  # ── User Service ──────────────────────────────────────────────────────────
  - name: user-service
    url: http://user-service:4002
